services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  backend:
    build: ./some-backend
    ports:
      - "3001:3006"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  webapp:
    build: ./some-webapp
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:3006
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    name: some-network

volumes:
  pgdata:
